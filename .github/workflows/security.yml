name: Source security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install source-export scanner dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Inspect source, index and reachable history
        run: node scripts/check-public-source.mjs --history
      - name: Test the source security gate
        run: node tests/public-source.test.mjs
      - name: Check frontend dependency advisories
        working-directory: frontend
        run: npm audit --audit-level=moderate --ignore-scripts
